services:
  pii-api:
    image: ghcr.io/lthoa1807/presidio-api-service:${PII_TAG:-latest}
    ports: ["8000:8000"]
    environment:
      PII_ANALYZER_URL: http://presidio-analyzer:3000
      PII_API_KEY: ${PII_API_KEY:-}
      PII_ANONYMIZE_SALT: ${PII_ANONYMIZE_SALT:-}
      PII_LOG_LEVEL: ${PII_LOG_LEVEL:-info}
    restart: unless-stopped
    networks: [presidio]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  presidio:
    external: true
    name: presidio_default
