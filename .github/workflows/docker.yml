name: build-and-push

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-master
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compose image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [ci, docker]
    # Enable by setting the repository variable DEPLOY_ENABLED=true and by
    # registering a self-hosted runner on the Docker host (see README > CI/CD).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux]
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image and restart the stack
        working-directory: ${{ vars.DEPLOY_PATH || '.' }}
        env:
          PII_TAG: ${{ needs.docker.outputs.tag }}
          PII_API_KEY: ${{ secrets.PII_API_KEY }}
          PII_ANONYMIZE_SALT: ${{ secrets.PII_ANONYMIZE_SALT }}
          PII_LOG_LEVEL: ${{ vars.PII_LOG_LEVEL || 'info' }}
        run: |
          set -euo pipefail
          docker compose pull pii-api
          docker compose up -d --remove-orphans
          docker compose ps

      - name: Verify health
        working-directory: ${{ vars.DEPLOY_PATH || '.' }}
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://localhost:8000/healthz' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 3 "$HEALTH_URL" > /dev/null; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::health check failed at $HEALTH_URL, showing logs"
          docker compose logs --tail=100 pii-api || true
          exit 1
